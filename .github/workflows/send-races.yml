name: Corridas SP - GitHubAct v26.10.09(~1m)

on:
  schedule:
    - cron: '51 7 * * 1,3,5'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:

#roda 7am seg-sex (horario de Sao Paulo, UTC-3) -> 10:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: corridas-sp

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Buscar corridas e gerar relatório
        run: node src/main.js

      - name: Fechar issues de dias anteriores
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const spDate = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
            const day = String(spDate.getDate()).padStart(2, '0');
            const month = String(spDate.getMonth() + 1).padStart(2, '0');
            const today = `${spDate.getFullYear()}/${month}/${day}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'reportrun',
              state: 'open',
              per_page: 100
            });
            const stale = issues.filter(i => !i.pull_request && !String(i.title).includes(today));
            for (const issue of stale) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              core.info(`Issue #${issue.number} fechada: ${issue.title}`);
            }
            core.info(`${stale.length} issue(s) anterior(is) fechada(s).`);

      - name: Criar Issue de alerta
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let raceCount = 0;
            let reportContent = '';
            try {
              const md = fs.readFileSync('docs/index.md', 'utf-8');
              const lines = md.split('\n');
              const dataRows = lines.filter(l => l.startsWith('|') && !l.startsWith('| ---') && !l.startsWith('| Evento'));
              raceCount = dataRows.length;
              reportContent = md;
            } catch (e) {
              reportContent = '';
            }
            const spDate = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
            const day = String(spDate.getDate()).padStart(2, '0');
            const month = String(spDate.getMonth() + 1).padStart(2, '0');
            const year = spDate.getFullYear();
            const today = `${year}/${month}/${day}`;
            const reportSection = reportContent
              ? `\n\n---\n\n${reportContent}`
              : '\n\n⚠️ Não foi possível ler o relatório.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 ${today} - Report Run`,
              body: `Corrida(s) **${raceCount} ** hoje.${reportSection}\n\nO relatório com formatação aprimorada está disponível no GitHub Pages.\n\n---\n🤖 Gerado automaticamente via GitHub Actions — Corridas SP`,
              assignees: ['juliomobi', 'qajulio'],
              labels: ['reportrun']
            });

      - name: Deploy no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
